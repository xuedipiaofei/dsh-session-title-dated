# DSH profile bundle for dated, categorised session titles.
#
# Selecting this bundle replaces the shipped first-prompt title provider. The
# inserted row is the provider package itself; disabling `session-title-llm`
# keeps only one provider registered, as the title service requires.
- id: session-title-llm
  disabled: true

- insert:
    - id: session-title-dated
      name: dsh-session-title-dated
      config:
        # 0 = title once on the first message; 10 = refresh every 10 human
        # messages. The provider itself never calls the model on every turn.
        retitleEvery: 10
        # MMDD matches the reference list (1027). The template can also use
        # {YYYYMMDD}, {YYMM}, {HHmm}, {type}, {topic}, etc.
        dateFormat: MMDD
        # Omit timeZone to follow the host's local zone.
        maxInputBytes: 4096
        maxOutputTokens: 4096
        timeoutMs: 90000
