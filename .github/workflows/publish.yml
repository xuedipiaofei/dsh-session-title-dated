name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# npm trusted publishing uses GitHub OIDC; no long-lived npm token is needed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: node --version
      - run: npm test
      - run: npm publish --provenance --access public
